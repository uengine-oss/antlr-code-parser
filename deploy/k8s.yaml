# antlr-code-parser — K8s 배포 스펙 (이 서비스 단독). 글루(namespace·공유PVC)는 엄브렐러(project/deploy).
# 입구 통일: 파싱 결과 data/ 를 analyzer 와 공유 → 공유 PVC(analyzer-data, RWX)를 /data 에 마운트.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robo-antlr-parser
  namespace: robo
spec:
  replicas: 1
  selector:
    matchLabels: { app: robo-antlr-parser }
  template:
    metadata:
      labels: { app: robo-antlr-parser }
    spec:
      containers:
        - name: antlr-parser
          image: robo/antlr-parser:latest      # 엄브렐러 kustomization 에서 레지스트리 치환
          env:
            - { name: DOCKER_COMPOSE_CONTEXT, value: /data }
          ports: [ { containerPort: 8081 } ]
          volumeMounts:
            - { name: work-data, mountPath: /data }
      volumes:
        - name: work-data
          persistentVolumeClaim:
            claimName: analyzer-data            # 엄브렐러가 정의(RWX) — analyzer 와 공유
---
apiVersion: v1
kind: Service
metadata:
  name: robo-antlr-parser
  namespace: robo
spec:
  selector: { app: robo-antlr-parser }
  ports: [ { port: 8081, targetPort: 8081 } ]
